[package]
name = "subscription"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shared-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
base64 = "0.22"
url = "2"
percent-encoding = "2"
# Clash-style proxy YAML import (see clash.rs) -- parsed leniently via
# `serde_yaml::Value` rather than a strict struct, since real-world Clash
# configs vary in field naming across generators.
serde_yaml = "0.9"
# rustls, not native-tls/OpenSSL, so Linux CI doesn't need system OpenSSL dev
# packages -- see fetch.rs's doc comment.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
