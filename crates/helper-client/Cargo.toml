[package]
name = "helper-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
helper-proto = { workspace = true }
serde_json = { workspace = true }
# "net" covers both `tokio::net::UnixStream` (macOS/Linux) and
# `tokio::net::windows::named_pipe::ClientOptions` (Windows) -- the latter
# is cfg(windows)-gated inside tokio itself, no extra feature needed here.
tokio = { workspace = true, features = ["net", "time"] }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
